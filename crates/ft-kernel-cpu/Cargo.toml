[package]
name = "frankentorch-kernel-cpu"
# 0.1.2 includes the post-0.1.1 kernels (including dynamic_int8_x86).
# Never reuse a registry version for changed source.
version = "0.1.2"
edition = "2024"
license-file = "LICENSE"
description = "Portable and SIMD-accelerated CPU kernels for FrankenTorch"
repository = "https://github.com/Dicklesworthstone/frankentorch"
readme = "README.md"
include = ["src/**", "benches/**", "Cargo.toml", "LICENSE", "README.md"]

[lib]
name = "ft_kernel_cpu"

[dependencies]
ft-core = { workspace = true }
libm = { workspace = true }
matrixmultiply = "0.3.11"
rayon = "1.12"
wide = "1.5"

[dev-dependencies]
insta = "1.48.0"
proptest = "1.11.0"
rusty-fork = "0.3.1"
criterion = { workspace = true }

[[bench]]
name = "sdpa_br"
harness = false

[[bench]]
name = "sgemm_tile_shape"
harness = false

[[bench]]
name = "gemm_bench"
harness = false

[[bench]]
name = "winograd_bench"
harness = false

[[bench]]
name = "elementwise_bench"
harness = false

[[bench]]
name = "softmax_bench"
harness = false

[[bench]]
name = "linalg_bench"
harness = false

[[bench]]
name = "sort_bench"
harness = false

[[bench]]
name = "topk_bench"
harness = false

[[bench]]
name = "scan_ab"
harness = false

[lints]
workspace = true
