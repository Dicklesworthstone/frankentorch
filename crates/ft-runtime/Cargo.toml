[package]
name = "frankentorch-runtime"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Deterministic runtime evidence integration for FrankenTorch"
repository = "https://github.com/Dicklesworthstone/frankentorch"
readme = "../../README.md"
include = ["src/**", "Cargo.toml"]

[lib]
name = "ft_runtime"

[features]
default = []
asupersync-integration = ["dep:asupersync"]
frankentui-integration = ["dep:ftui"]

[dependencies]
ft-core = { workspace = true }
asupersync = { workspace = true, optional = true }
ftui = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
ft-serialize = { workspace = true }
insta = "1.48.0"

[[bench]]
name = "runtime_bench"
harness = false

[lints]
workspace = true
