[package]
name = "frankentorch-core"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
description = "Memory-safe tensor types and scalar semantics for FrankenTorch"
repository = "https://github.com/Dicklesworthstone/frankentorch"
readme = "README.md"
include = ["src/**", "benches/**", "Cargo.toml", "LICENSE", "README.md"]

[lib]
name = "ft_core"

[dependencies]
half = { version = "2.7", features = ["bytemuck"] }
num-complex = "0.4.6"

[dev-dependencies]
criterion = { workspace = true }
proptest = "1.11.0"

[[bench]]
name = "core_bench"
harness = false

[lints]
workspace = true
