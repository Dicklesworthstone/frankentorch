[package]
name = "ft-core"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Memory-safe tensor types and scalar semantics for FrankenTorch"
repository = "https://github.com/Dicklesworthstone/frankentorch"

[dependencies]
half = { version = "2.7", features = ["bytemuck"] }
num-complex = "0.4.6"

[dev-dependencies]
criterion = { workspace = true }
proptest = "1.11.0"

[[bench]]
name = "core_bench"
harness = false

[lints]
workspace = true
