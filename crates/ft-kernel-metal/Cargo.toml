[package]
name = "ft-kernel-metal"
# 0.1.1: the October 10 command-buffer failure/retry correction.
# 0.1.2: typed native input from the presenter (pointer, buttons, scroll, keys,
# modifiers, focus, capture loss, resize) and the `synthetic-input` test seam.
version = "0.1.2"
edition = "2024"
license-file = "../../LICENSE"
description = "Metal GPU compute kernels for FrankenTorch (macOS / Apple Silicon). Safe API; all unsafe Metal FFI is contained here. No-op stub on non-macOS targets."
repository = "https://github.com/Dicklesworthstone/frankentorch"

# Metal is macOS-only. Target-gating the dep keeps this crate compilable in the
# workspace on Linux/Windows (where it degrades to an always-unavailable stub),
# so adding it to the workspace never breaks non-macOS builds.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics-types = "0.2.0"
foreign-types = "0.5.0"
metal = "0.33.0"
objc = "0.2.7"
# f32->f16 conversion for GPU-resident f16 weights (same crate ft-core uses).
half = { version = "2.7", default-features = false, features = ["std"] }

[dev-dependencies]

[features]
# Test seam for dependents' tests: `inject_command_buffer_faults(n)` makes the
# next `n` command buffers submitted from the calling thread end without running,
# the way a GPU restart aborts in-flight work. Never enable it in a shipped build.
fault-injection = []
# Test seam for dependents' tests: `NativePresenter::post_synthetic` posts real
# AppKit events for the presenter's window into the application queue, so they
# take the same dispatch and translation path as user input. Never enable it in
# a shipped build.
synthetic-input = []

# Opens a real window on the main thread, so it runs without the libtest
# harness: `cargo test -p ft-kernel-metal --features synthetic-input --test native_input`.
[[test]]
name = "native_input"
harness = false
required-features = ["synthetic-input"]
