[package]
name = "frankentorch-dispatch"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Tensor operation dispatch and CPU-kernel routing for FrankenTorch"
repository = "https://github.com/Dicklesworthstone/frankentorch"
readme = "../../README.md"
include = ["src/**", "Cargo.toml"]

[lib]
name = "ft_dispatch"

[dependencies]
ft-core = { workspace = true }
ft-kernel-cpu = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
insta = "1.48.0"
proptest = "1.11.0"

[[bench]]
name = "dispatch_bench"
harness = false

[lints]
workspace = true
