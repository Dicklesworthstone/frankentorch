[workspace]
resolver = "2"
members = [
  "crates/ft-core",
  "crates/ft-dispatch",
  "crates/ft-kernel-cpu",
  "crates/ft-kernel-metal",
  "crates/ft-autograd",
  "crates/ft-device",
  "crates/ft-serialize",
  "crates/ft-api",
  "crates/ft-conformance",
  "crates/ft-runtime",
  "crates/ft-nn",
  "crates/ft-optim",
  "crates/ft-data",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license-file = "LICENSE"
repository = "https://github.com/Dicklesworthstone/frankentorch"

[workspace.dependencies]
ft-core = { package = "frankentorch-core", version = "0.1.0", path = "crates/ft-core" }
ft-dispatch = { package = "frankentorch-dispatch", version = "0.1.0", path = "crates/ft-dispatch" }
ft-kernel-cpu = { package = "frankentorch-kernel-cpu", version = "0.1.0", path = "crates/ft-kernel-cpu" }
ft-autograd = { package = "frankentorch-autograd", version = "0.1.0", path = "crates/ft-autograd" }
ft-device = { path = "crates/ft-device" }
ft-serialize = { path = "crates/ft-serialize" }
ft-api = { package = "frankentorch-api", version = "0.1.0", path = "crates/ft-api" }
ft-conformance = { path = "crates/ft-conformance" }
ft-runtime = { package = "frankentorch-runtime", version = "0.1.0", path = "crates/ft-runtime" }
ft-nn = { path = "crates/ft-nn" }
ft-optim = { path = "crates/ft-optim" }
ft-data = { path = "crates/ft-data" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
safetensors = "0.8"
allocation-counter = "0.8.1"
libm = "0.2.16"
bytemuck = "1.25.2"

# NOTE: `test-internals` is deliberately NOT enabled. It is a security gate
# (it unlocks `Cx::for_testing`, which bypasses runtime cap-mask enforcement, and
# swaps `DetHasher::default()` to a fixed seed). Up to asupersync 0.3.4 we needed it
# because `DetBuildHasher::for_production()` re-seeded on every `build_hasher()` call,
# violating the `BuildHasher` contract; asupersync 0.3.9 fixed that (the seed is now
# captured once per builder). Code that needs a reproducible content hash now calls
# `DetHasher::for_lab()` explicitly instead of relying on the feature flag.
asupersync = { version = "0.3.9", default-features = false }
ftui = { version = "0.2.0", default-features = false }
criterion = { version = "0.5", features = ["html_reports"] }

[patch.crates-io]
# `metal 0.33.0` still depends on the unmaintained `block 0.1.6`. This
# reviewed fork changes only its invalid uninhabited extern-static model;
# keep the exact revision aligned with FrankenManim's governed closure.
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release-perf]
inherits = "release"
debug = "line-tables-only"
strip = false
lto = "thin"

[profile.bench]
inherits = "release"
debug = "line-tables-only"
